name: camera_embedded
description: OmniSight Omnidirectional Video Processor for Linux Desktop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.1.0
  media_kit_video: ^1.1.0
  media_kit_libs_linux: ^1.2.1
  # File Selection
  image_picker: ^1.0.7          # Untuk mobile
  file_picker: ^6.1.1           # Untuk desktop
  
  # Desktop Utilities
  window_manager: ^0.3.9
  path_provider: ^2.1.2
  
  # UI & Utils
  collection: ^1.18.0
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  shaders:
    - shaders/anypoint.frag
    - shaders/julia.frag
  assets:
    - assets/camera_config.json